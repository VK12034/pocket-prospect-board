<script type="application/json" id="backlog-data">{"text":"","shell":true,"owners":["vishnu","rishabh","vihaan"],"repo":"VK12034/pocket-prospect","branch":"main","path":"BACKLOG.md"}</script>
<script>// Shared BACKLOG.md parser, checker and editor. Runs in Node (scripts/*) and in the browser
// (scripts/build-dashboard inlines this file into docs/index.html as window.Backlog), so the
// dashboard enforces exactly the same rules as validate-backlog. No packages, no I/O in here
// except the optional fileExists callback.
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.Backlog = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const STATUSES = ["todo", "queued", "in progress", "blocked", "done"];
  const PRIORITIES = ["P0", "P1", "P2"];
  const REQUIRED = ["Owner", "Status", "Priority", "Link", "Update"];
  const OPTIONAL = ["Agent", "Ask", "Done when", "Refs", "Blocked"];
  const FIELD_ORDER = REQUIRED.concat(OPTIONAL);
  const AGENTS = ["claude", "codex"];
  const UNASSIGNED = "unassigned";
  const EVERYONE = "everyone"; // "Area everyone: ..." = files anyone may edit after claiming a task
  const ID_RE = /^[A-Z][A-Z0-9]*-\d+$/;
  const IMAGE_RE = /\.(png|jpe?g|gif|webp)$/i; // "Refs:" = reference images (screenshots) stored under prompts/<ID>/
  const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})\b/;
  const FIELD_RE = /^[-*]\s+([A-Za-z][A-Za-z ]*?):\s*(.*)$/;
  const SECTION_RE = /^##\s+(.+?)\s*$/;
  const TASK_RE = /^###\s+(.*)$/;

  const toLines = (text) => text.replace(/\r\n?/g, "\n").split("\n");
  const splitList = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
  const isSection = (raw) => SECTION_RE.test(raw) && !raw.startsWith("###");

  // Parse BACKLOG.md text into { owners, systems, sections, tasks, errors, warnings }.
  // Every problem is collected (not thrown) so one run reports all of them.
  // opts.fileExists(relPath) -> bool enables the link check (Node only).
  function parse(text, opts) {
    opts = opts || {};
    const file = opts.fileName || "BACKLOG.md";
    const errors = [];
    const warnings = [];
    const err = (line, msg) => errors.push(`${file}:${line}: ${msg}`);
    const warn = (line, msg) => warnings.push(`${file}:${line}: ${msg}`);

    const lines = toLines(text);
    let owners = null;
    let systems = null;
    const areas = {};
    const areaLines = {};
    const roles = {}; // owner -> one line on what they're responsible for ("Role <owner>: ...")
    const roleLines = {};
    const sections = []; // { name, line, tasks: [] }
    const tasks = [];
    let section = null;
    let task = null;
    let inFence = false;

    for (let i = 0; i < lines.length; i++) {
      const n = i + 1;
      const raw = lines[i];
      const line = raw.trim();

      if (line.startsWith("```")) { inFence = !inFence; continue; }
      if (inFence) continue;

      let m;
      if (!section && (m = /^Owners:\s*(.*)$/.exec(line))) { owners = splitList(m[1]); continue; }
      if (!section && (m = /^Systems:\s*(.*)$/.exec(line))) { systems = splitList(m[1]); continue; }
      if (!section && (m = /^Area\s+([^:\s]+):\s*(.*)$/.exec(line))) { areas[m[1]] = splitList(m[2]); areaLines[m[1]] = n; continue; }
      if (!section && (m = /^Role\s+([^:\s]+):\s*(.*)$/.exec(line))) { roles[m[1]] = m[2].trim(); roleLines[m[1]] = n; continue; }

      if (isSection(raw)) {
        const name = SECTION_RE.exec(raw)[1];
        task = null;
        if (!systems) err(n, `section "${name}" comes before the "Systems:" line; put "Systems: ..." at the top of the file`);
        else if (!systems.includes(name)) err(n, `section "${name}" is not a system. Use one of: ${systems.join(", ")} (or add it to the "Systems:" line)`);
        if (sections.some((s) => s.name === name)) err(n, `section "${name}" appears twice; keep one section per system`);
        section = { name, line: n, tasks: [] };
        sections.push(section);
        continue;
      }

      if ((m = TASK_RE.exec(raw))) {
        const head = m[1].trim();
        const hm = /^([^:\s]+)\s*:\s*(.+)$/.exec(head);
        if (!hm) {
          err(n, `task heading "${head}" must look like "### PASS-1: Short title"`);
          task = null;
          continue;
        }
        if (!section) err(n, `task ${hm[1]} is above the first "## System" heading; move it under one`);
        task = { id: hm[1], title: hm[2].trim(), line: n, system: section ? section.name : null, fields: {}, fieldLines: {} };
        if (!ID_RE.test(task.id)) err(n, `task ID "${task.id}" must be letters, a dash and a number, like PASS-1`);
        tasks.push(task);
        if (section) section.tasks.push(task);
        continue;
      }

      if ((m = FIELD_RE.exec(line)) && task) {
        const key = m[1];
        const value = m[2].trim();
        if (!FIELD_ORDER.includes(key)) {
          err(n, `${task.id}: unknown field "${key}". Fields are: ${FIELD_ORDER.join(", ")}`);
          continue;
        }
        if (key in task.fields) err(n, `${task.id}: field "${key}" appears twice`);
        task.fields[key] = value;
        task.fieldLines[key] = n;
      }
    }

    if (inFence) err(lines.length, "a ``` code block is never closed");
    if (!owners) err(1, 'missing the "Owners: ..." line at the top (example: "Owners: vishnu, rishabh")');
    if (!systems) err(1, 'missing the "Systems: ..." line at the top (example: "Systems: Passing, Coverage, Draft, Season, Art, UI")');

    for (const a of Object.keys(areas)) {
      if (a !== EVERYONE && owners && !owners.includes(a)) err(areaLines[a], `"Area ${a}:" names someone who isn't on the "Owners:" line`);
    }
    for (const r of Object.keys(roles)) {
      if (owners && !owners.includes(r)) err(roleLines[r], `"Role ${r}:" names someone who isn't on the "Owners:" line`);
    }

    const seen = new Map();
    for (const t of tasks) {
      const where = (k) => t.fieldLines[k] || t.line;
      if (seen.has(t.id)) err(t.line, `duplicate task ID ${t.id} (first used on line ${seen.get(t.id)}); give one of them a new number`);
      else seen.set(t.id, t.line);

      for (const k of REQUIRED) {
        if (!(k in t.fields)) err(t.line, `${t.id}: missing "- ${k}:" line`);
        else if (t.fields[k] === "") err(where(k), `${t.id}: "${k}" is empty`);
      }

      const status = t.fields.Status;
      const validStatus = STATUSES.includes(status);
      if (status && !validStatus) err(where("Status"), `${t.id}: status "${status}" is not valid. Use one of: ${STATUSES.join(", ")}`);
      const prio = t.fields.Priority;
      if (prio && !PRIORITIES.includes(prio)) err(where("Priority"), `${t.id}: priority "${prio}" is not valid. Use P0, P1 or P2`);
      const owner = t.fields.Owner;
      if (owner && owners && owner !== UNASSIGNED && !owners.includes(owner)) {
        err(where("Owner"), `${t.id}: owner "${owner}" is not listed. Use one of: ${owners.concat(UNASSIGNED).join(", ")} (or add the name to the "Owners:" line)`);
      }
      if (owner === UNASSIGNED && validStatus && status !== "todo") {
        err(where("Owner"), `${t.id}: a task that is "${status}" needs an owner, not "${UNASSIGNED}"`);
      }
      if (status === "blocked" && !t.fields.Blocked) err(where("Status"), `${t.id}: blocked tasks need a "- Blocked: <why>" line`);
      if ("Blocked" in t.fields && validStatus && status !== "blocked") {
        warn(where("Blocked"), `${t.id}: has a "Blocked:" line but status is "${status}"; remove the line once it's unblocked`);
      }
      const agent = t.fields.Agent;
      if (agent !== undefined && !AGENTS.includes(agent)) {
        err(where("Agent"), `${t.id}: agent "${agent}" is not valid. Use one of: ${AGENTS.join(", ")} (or leave the line out)`);
      }
      if ((status === "in progress" || status === "queued") && agent === undefined) {
        err(where("Status"), `${t.id}: a task that is "${status}" needs "- Agent: ${AGENTS.join(" | ")}" (the tool doing the work)`);
      }
      if (t.fields.Refs) {
        for (const r of splitList(t.fields.Refs)) {
          if (!IMAGE_RE.test(r) || /^[a-z]+:/i.test(r)) { err(where("Refs"), `${t.id}: "${r}" in Refs must be an image file in the repo (png, jpg, gif or webp), like prompts/${t.id}/ref-1.png`); continue; }
          if (opts.fileExists && !opts.fileExists(r)) warn(where("Refs"), `${t.id}: reference image "${r}" does not exist`);
        }
      }
      const upd = t.fields.Update;
      if (upd) {
        const dm = DATE_RE.exec(upd);
        if (!dm) err(where("Update"), `${t.id}: "Update" must start with a date, like "2026-11-18 - what changed"`);
        else {
          const d = new Date(`${dm[1]}-${dm[2]}-${dm[3]}T00:00:00Z`);
          if (isNaN(d) || d.toISOString().slice(0, 10) !== dm[0]) err(where("Update"), `${t.id}: "${dm[0]}" is not a real date`);
        }
      }
      if (t.fields.Link && opts.fileExists) {
        for (const link of splitList(t.fields.Link)) {
          if (/^place:\d+$/.test(link) || /^https?:\/\//.test(link) || link === "none") continue;
          if (/^place:/.test(link)) { err(where("Link"), `${t.id}: "${link}" should be place:<numeric placeId>`); continue; }
          const p = link.replace(/[#:].*$/, ""); // allow file.luau#L20 or file.luau:20
          if (!opts.fileExists(p)) warn(where("Link"), `${t.id}: linked file "${p}" does not exist (fine if the task creates it)`);
        }
      }
    }

    for (const s of sections) if (s.tasks.length === 0) warn(s.line, `section "${s.name}" has no tasks`);

    const lineOf = (s) => Number(/:(\d+):/.exec(s)[1]);
    errors.sort((a, b) => lineOf(a) - lineOf(b));
    warnings.sort((a, b) => lineOf(a) - lineOf(b));
    return { owners: owners || [], systems: systems || [], areas, roles, sections, tasks, errors, warnings };
  }

  // ---------- Editing (used by the dashboard; every edit is re-validated before it's saved) ----------

  function fail(msg) { const e = new Error(msg); e.userFacing = true; throw e; }
  const oneLine = (s) => String(s == null ? "" : s).replace(/[\r\n]+/g, " ").trim();

  // Set or remove fields of one task, keeping every other line as it is.
  // changes: { Field: "value" | null }  (null removes the line)
  // Line index of a task's "### ID:" heading, skipping ``` code blocks (the format example). -1 if absent.
  function taskLine(lines, id) {
    let inFence = false;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].trim().startsWith("```")) { inFence = !inFence; continue; }
      const m = !inFence && TASK_RE.exec(lines[i]);
      if (m && m[1].trim().split(/\s*:/)[0] === id) return i;
    }
    return -1;
  }
  function editTask(text, id, changes) {
    const lines = toLines(text);
    const head = taskLine(lines, id);
    if (head < 0) fail(`task ${id} is not in the backlog any more`);
    let end = head + 1;
    while (end < lines.length && FIELD_RE.test(lines[end].trim())) end++;
    const block = lines.slice(head + 1, end);
    const keyOf = (l) => FIELD_RE.exec(l.trim())[1];
    for (const [k, v] of Object.entries(changes)) {
      if (!FIELD_ORDER.includes(k)) fail(`unknown field ${k}`);
      const i = block.findIndex((l) => keyOf(l) === k);
      if (v === null || v === undefined) { if (i >= 0) block.splice(i, 1); continue; }
      const line = `- ${k}: ${oneLine(v)}`;
      if (i >= 0) { block[i] = line; continue; }
      // Insert in canonical order: after the last existing field that comes before k.
      const rank = FIELD_ORDER.indexOf(k);
      let at = 0;
      block.forEach((l, j) => { if (FIELD_ORDER.indexOf(keyOf(l)) < rank) at = j + 1; });
      block.splice(at, 0, line);
    }
    return lines.slice(0, head + 1).concat(block, lines.slice(end)).join("\n");
  }

  // Next free ID for a system: the prefix its tasks already use (else the system name in capitals).
  function nextId(parsed, system) {
    const sec = parsed.sections.find((s) => s.name === system);
    const ids = (sec ? sec.tasks : []).map((t) => t.id).filter((x) => ID_RE.test(x));
    const prefix = ids.length ? ids[0].replace(/-\d+$/, "") : system.toUpperCase().replace(/[^A-Z0-9]/g, "") || "TASK";
    let max = 0;
    for (const t of parsed.tasks) {
      const m = new RegExp(`^${prefix}-(\\d+)$`).exec(t.id);
      if (m) max = Math.max(max, Number(m[1]));
    }
    return `${prefix}-${max + 1}`;
  }

  // Append a task at the end of its system's section.
  function addTask(text, system, id, title, fields) {
    const lines = toLines(text);
    const start = lines.findIndex((l) => isSection(l) && SECTION_RE.exec(l)[1] === system);
    if (start < 0) fail(`there is no "## ${system}" section`);
    let end = start + 1;
    while (end < lines.length && !isSection(lines[end])) end++;
    let insertAt = end;
    while (insertAt > start + 1 && lines[insertAt - 1].trim() === "") insertAt--;
    const block = ["", `### ${id}: ${oneLine(title)}`];
    for (const k of FIELD_ORDER) if (fields[k] !== undefined && fields[k] !== null && fields[k] !== "") block.push(`- ${k}: ${oneLine(fields[k])}`);
    const tail = lines.slice(end);
    if (tail.length && tail[0].trim() !== "") block.push("");
    else if (!tail.length) block.push("");
    return lines.slice(0, insertAt).concat(block, tail).join("\n");
  }

  // ---------- Dashboard actions: rules + edits. `me` is the acting owner, `today` is YYYY-MM-DD. ----------

  function find(text, id) {
    const p = parse(text);
    const t = p.tasks.find((x) => x.id === id);
    if (!t) fail(`task ${id} is not in the backlog any more`);
    return { p, t };
  }

  function canQueue(t, me) {
    const f = t.fields;
    if (f.Owner !== me && f.Owner !== UNASSIGNED) return `${t.id} belongs to ${f.Owner}; only they can queue it`;
    if (f.Status === "in progress") return `${t.id} is already in progress (${f.Agent || "?"}); wait for it or ask ${f.Owner}`;
    // blocked: the owner may queue it again (queueTask clears the Blocked line)
    if (f.Status === "done") return `${t.id} is done; add a new task for follow-up work`;
    return null;
  }

  function queueTask(text, id, me, agent, ask, today, doneWhen) {
    if (!AGENTS.includes(agent)) fail(`unknown agent ${agent}`);
    const { t } = find(text, id);
    const why = canQueue(t, me);
    if (why) fail(why);
    return editTask(text, id, {
      Owner: me, Status: "queued", Agent: agent, Ask: oneLine(ask) || null, "Done when": joinChecks(doneWhen) || null, Blocked: null,
      Update: `${today} - queued for ${agent} by ${me} from the dashboard`,
    });
  }

  function unqueueTask(text, id, me, today) {
    const { t } = find(text, id);
    if (t.fields.Status !== "queued") fail(`${id} isn't queued any more (it's ${t.fields.Status})`);
    if (t.fields.Owner !== me) fail(`${id} was queued by ${t.fields.Owner}; only they can take it off the queue`);
    // Keep Ask: it's the task's description too, and the next person to start it needs it.
    return editTask(text, id, { Status: "todo", Agent: null, "Done when": null, Update: `${today} - taken off the queue by ${me}` });
  }

  function markDone(text, id, me, today) {
    const { t } = find(text, id);
    if (t.fields.Owner !== me) fail(`${id} belongs to ${t.fields.Owner}; only they can mark it done`);
    if (t.fields.Status === "done") fail(`${id} is already done`);
    return editTask(text, id, { Status: "done", Agent: null, Ask: null, "Done when": null, Blocked: null, Update: `${today} - marked done by ${me} from the dashboard` });
  }

  // Can `me` delete this task? null = yes, else why not.
  function canDelete(t, me) {
    const f = t.fields;
    if (f.Owner !== me && f.Owner !== UNASSIGNED) return `${t.id} belongs to ${f.Owner}; only they can delete it`;
    if (f.Status === "in progress") return `${t.id} is in progress (${f.Agent || "someone"} is working on it); wait for it to finish or block first`;
    return null;
  }
  // Remove a task's heading and field lines (and one blank line around it). Returns { text, task }.
  function deleteTask(text, id, me) {
    const { t } = find(text, id);
    const why = canDelete(t, me);
    if (why) fail(why);
    const lines = toLines(text);
    const head = taskLine(lines, id);
    let end = head + 1;
    while (end < lines.length && FIELD_RE.test(lines[end].trim())) end++;
    let start = head;
    if (end < lines.length && !lines[end].trim()) end++; // the blank line after it
    else if (start > 0 && !lines[start - 1].trim()) start--; // last in its section: the blank line before it
    return { text: lines.slice(0, start).concat(lines.slice(end)).join("\n"), task: t };
  }

  // Retry a blocked task: back on the queue for the same agent with the same Ask / Done when.
  // The block reason moves into the Update line so the next run (and the dashboard) can see it.
  function retryTask(text, id, me, today) {
    const { t } = find(text, id);
    const f = t.fields;
    if (f.Status !== "blocked") fail(`${id} isn't blocked any more (it's ${f.Status})`);
    if (f.Owner !== me) fail(`${id} belongs to ${f.Owner}; only they can retry it`);
    if (!AGENTS.includes(f.Agent)) fail(`${id} has no agent to retry with; use Start task to pick one`);
    const why = oneLine(f.Blocked);
    const short = why.length > 140 ? why.slice(0, 137) + "..." : why;
    return editTask(text, id, {
      Status: "queued", Blocked: null,
      Update: `${today} - retried for ${f.Agent} by ${me} from the dashboard` + (short ? ` (was blocked: ${short})` : ""),
    });
  }

  // ---------- automatic category (system) for a new task ----------
  // Score = keyword hits for the built-in systems + words and files shared with the tasks already
  // in each section (so systems added to the "Systems:" line get matched too). Returns
  // { system, score, why: [matched words] }; with no signal at all it falls back to the first system.
  const KEYWORDS = {
    passing: "pass passing throw throws throwing thrower qb quarterback receiver receivers wr te rb route routes catch catches catching ball trajectory bullet lob touch accuracy target targets snap snaps play plays playbook audible audibles hot handoff give scramble slide throwaway pocket sack sacks progression read reads timing release drop dropback motion",
    coverage: "coverage coverages cover defense defensive defender defenders defend man zone blitz blitzes rush rusher pressure linebacker linebackers lb cornerback cb safety safeties shell disguise disguised interception interceptions intercept pick picks swat swats deflection tackle tackles tackling pursuit return returns nickel dime look looks",
    draft: "draft drafted drafting tryout tryouts combine prospect prospects rookie scout scouting stock ranking rankings workout workouts grade grading",
    season: "season seasons career careers game games schedule week weeks standings playoff playoffs record records stat stats save saves saving datastore progress progression xp level levels contract recap league opponent opponents clock penalty penalties tendencies two-minute drive drives",
    art: "art model models mesh meshes helmet helmets uniform uniforms jersey stadium field turf grass animation animations anim blender fbx texture textures lighting light lights crowd vfx particle particles effect effects color colors logo logos visual visuals sky camera rig rigs pose",
    ui: "ui hud button buttons menu menus screen screens mobile phone phones tablet touch joystick layout font fonts scorebug scoreboard broadcast banner theme text label labels popup dialog icon icons tap swipe gui overlay reveal tooltip small smaller big bigger size resize readable",
  };
  const STOP = new Set("the a an and or of to in on for with from into out by at as is it be this that make add fix new more less better use when after before so up down get set all any some too very not can its our my".split(" "));
  const words = (s) => String(s || "").toLowerCase().split(/[^a-z0-9-]+/).map((w) => w.replace(/^-+|-+$/g, "")).filter((w) => w.length > 1);
  const stem = (w) => (w.length > 4 && w.endsWith("es") && !w.endsWith("ses") ? w.slice(0, -2) : w.length > 3 && w.endsWith("s") && !w.endsWith("ss") ? w.slice(0, -1) : w);

  function guessSystem(parsed, title, link) {

    const tw = words(title).filter((w) => !STOP.has(w));
    const tset = new Set(tw.concat(tw.map(stem)));
    const files = String(link || "").split(",").map((x) => x.trim().replace(/[#:].*$/, "")).filter((x) => x && x !== "none");
    let best = null;
    systems.forEach((sys, order) => {
      let score = 0;
      const why = [];
      const kw = KEYWORDS[sys.toLowerCase()];
      if (kw) for (const k of new Set(kw.split(" "))) if (tset.has(k) && !why.some((x) => stem(x) === stem(k))) { score += 3; why.push(k); }
      if (tset.has(sys.toLowerCase()) && !why.includes(sys.toLowerCase())) { score += 3; why.push(sys.toLowerCase()); }

      if (sec) {
        const seen = new Set();

        for (const t of sec.tasks) {

  // ---------- reference screenshots (Refs:), stored in the repo at prompts/<ID>/ref-<n>.<ext> ----------
  var MAX_REFS = 6, MAX_REF_BYTES = 900000; // under 1 MB so the contents API returns them inline

  // Shrink to at most 1600 px; PNG if it fits, else JPEG at falling quality.
  function prepImage(file) {
    if (!file || !/^image\//.test(file.type)) return Promise.reject(new Error((file && file.name || "That file") + " isn't an image."));
    if (!window.createImageBitmap) return Promise.reject(new Error("This browser can't read images here. Try Chrome, Edge or Safari."));

  // A drop zone + paste target + file chooser. used = screenshots the task already has.
  function imagePicker(used) {
    var items = [], pending = Promise.resolve();

    var note = h("small", null, "Paste a screenshot (Ctrl+V), drop images here, or choose files. Up to " + Math.max(0, MAX_REFS - used) + ".");
    var input = h("input", { type: "file", accept: "image/*", multiple: true, hidden: true });
    function draw() {
      list.textContent = "";

  // Upload screenshots for a task, then add their paths to its "Refs:" line. Resolves with the paths.

    var paths = [], n = 0;
    var put = function (it, k) {
      var p = "prompts/" + id + "/ref-" + k + "." + it.ext;

  // ---------- AI: "Improve with AI" (Claude API, the viewer's own key, browser-direct) ----------
  var AI_SYSTEM = [

    return fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": S.akey,
        "anthropic-version": "2026-10-21",
        "anthropic-beta": "server-side-fallback-2026-07-01",
        "anthropic-dangerous-direct-browser-access": "true"

  // ---------- actions ----------
  function queue(id, agent, ask, doneWhen, promptText) {
    setBusy(true);
    return savePrompt(id, promptText).then(function () {
      setBusy(false);
      return commit(function (t) { return B.queueTask(t, id, S.me, agent, ask, today(), doneWhen); },
        function () { return "Backlog: queue " + id + " for " + agent + " (" + S.me + ", dashboard)"; });
    }, function (e) { setBusy(false); banner("error", e.message); throw e; })
      .then(function (x) { banner("ok", "Queued " + id + " for " + AGENT_LABEL[agent] + " with its prompt (commit " + x.commit + "). " + cap(S.me) + "'s " + AGENT_LABEL[agent] + " picks it up at the start of its next session."); });
  }
  function unqueue(id) {

      if (!r.ok) return null; // no saved prompt: next-task builds one from the backlog, which carries the reason

      return savePrompt(id, saved + "\n\n## Retry note\nThe last run was blocked: " + why +
        "\nDeal with that first (or work around it inside your area), then finish the task as described above.\n");
    }).then(function () {
      setBusy(false);
      return commit(function (text) { return B.retryTask(text, id, S.me, today()); },
        function () { return "Backlog: retry " + id + " for " + t.fields.Agent + " (" + S.me + ", dashboard)"; });
    }, function (e) { setBusy(false); banner("error", e.message); throw e; })

  }
  // Delete a task: take it out of BACKLOG.md, then remove its saved prompt, plan and screenshots, so
  // a later task that gets the same ID starts clean. The files go only after the backlog commit.
  function del(t) {
    var id = t.id;

    return commit(function (text) { return B.deleteTask(text, id, S.me); },

      .then(function (x) {

  // Start task: describe it -> get a detailed prompt -> copy it, improve it with AI, or queue it.

    function describeStep() {

      var ask = h("textarea", { name: "ask", rows: "4", maxlength: "1500", placeholder: "e.g. Make the THROW button 20% bigger on phones and keep it clear of the joystick." }, st.ask);
      var doneTa = h("textarea", { name: "done", rows: "3", maxlength: "600", placeholder: "One per line, e.g.\nTHROW is 20% bigger on a 375px-wide screen\nNo overlap with the joystick" }, st.done);

        e.preventDefault();
        st.agent = agentSel.value; st.ask = ask.value; st.done = doneTa.value;

    if (S.token && !S.me && state.live) banner("info", "Choose who you are in Settings to queue work.");

    $("board").hidden = !connected;
    var sb = $("scoreboard");
    sb.textContent = "";
    ["queued", "in progress", "blocked", "todo", "done"].forEach(function (s) {
      add(sb, h("div", { class: "tile s-" + slug(s) }, h("b", null, count(tasks, s)), h("span", null, STATUS_LABEL[s])));
    });
    var nd = count(tasks, "done");
    var prog = $("progress");
    prog.textContent = "";
    add(prog, [bar(tasks), h("p", null, h("b", null, tasks.length ? Math.round(100 * nd / tasks.length) + "%" : "0%"), " done · " + nd + " of " + tasks.length + " tasks")]);

    var people = $("people");
    people.textContent = "";
    p.owners.forEach(function (o) {
      var mine = tasks.filter(function (t) { return t.fields.Owner === o; });
      var q = count(mine, "queued"), r = count(mine, "in progress"), td = count(mine, "todo"), bl = count(mine, "blocked");
      var line = [r ? r + " running" : "", q ? q + " queued" : "", bl ? bl + " blocked" : "", td ? td + " to do" : ""].filter(Boolean).join(" · ") || "All clear";
      add(people, h("button", { type: "button", class: "person" + (S.filter === o ? " on" : ""), "aria-pressed": String(S.filter === o),
        onclick: function () { S.filter = S.filter === o ? "all" : o; setSetting("filter", S.filter); render(); } },
        avatar(o, true),
        h("span", { class: "pinfo" }, h("span", { class: "pname" }, cap(o), o === S.me ? h("span", { class: "you" }, "You") : null), h("span", { class: "pline" }, line)),
        personTasks(mine),
        bar(mine)));
    });

    var filters = $("filters");
    filters.textContent = "";
    ["all"].concat(p.owners, B.UNASSIGNED).forEach(function (o) {
      add(filters, h("button", { type: "button", "aria-pressed": String(S.filter === o), onclick: function () { S.filter = o; setSetting("filter", o); render(); } },
        o === "all" ? "Everyone" : cap(o)));
    });

    var nav = $("nav");
    nav.textContent = "";
    add(nav, h("a", { href: "#queue" }, icon("clock"), "On the clock"));
    p.sections.forEach(function (s) { add(nav, h("a", { href: "#sys-" + slug(s.name) }, icon(SYS_ICON[slug(s.name)]), s.name)); });
    if (p.roles && Object.keys(p.roles).length) add(nav, h("a", { href: "#roles" }, icon("check"), "Who does what"));

    var body = $("sections");
    body.textContent = "";
    if (!connected) {
      add(body, h("section", { class: "connect" },
        h("div", { class: "connect-icon" }, icon("ball")),
        h("h2", null, "Connect to the backlog"),
        h("p", null, "This page holds no tasks itself. It loads them from the private repo with your own GitHub token."),
        h("ol", null,
          h("li", null, "Tap Settings, choose who you are and paste your GitHub token."),
          h("li", null, "Queue your tasks for Claude or Codex.")),
        h("div", null, btn("Open Settings", "primary", settingsDialog, "sliders"))));
      return;
    }

    var active = tasks.filter(function (t) { return (t.fields.Status === "queued" || t.fields.Status === "in progress") && visible(t); }).sort(byWork);
    add(body, h("section", { id: "queue", class: "clock" },
      h("div", { class: "sec-head" },
        h("span", { class: "sec-icon" }, icon("clock")),
        h("h2", null, "On the clock"),
        h("span", { class: "count" }, active.length ? active.length + " waiting or running" : "empty")),
      active.length ? h("ul", { class: "qlist" }, active.map(function (t) {
        var f = t.fields;
        return h("li", { class: "qitem s-" + slug(f.Status) },
          h("a", { href: "#" + t.id, class: "qmain" },
            h("span", { class: "tid" }, t.id),
            h("span", { class: "qtitle" }, t.title)),
          h("span", { class: "qmeta" }, avatar(f.Owner), agentBadge(f.Agent), statusPill(f)));
      })) : h("p", { class: "empty" }, canWrite() ? "Nothing queued. Tap Claude or Codex on one of your tasks to hand it off." : "Nothing queued right now.")));

    p.sections.forEach(function (s) {
      var list = s.tasks.filter(visible);
      var open = list.filter(function (t) { return t.fields.Status !== "done"; }).sort(byWork);
      var fin = list.filter(function (t) { return t.fields.Status === "done"; }).sort(byWork);
      add(body, h("section", { id: "sys-" + slug(s.name), class: "system" },
        h("div", { class: "sec-head" },
          h("span", { class: "sec-icon" }, icon(SYS_ICON[slug(s.name)])),
          h("h2", null, s.name),
          h("span", { class: "count" }, list.length ? fin.length + "/" + list.length + " done" : "no tasks")),
        list.length ? bar(list) : null,
        open.length ? open.map(card) : (list.length ? h("p", { class: "empty" }, icon("check"), "Everything here is done.") : null),
        fin.length ? h("details", null, h("summary", null, "Show " + fin.length + " completed"), fin.map(card)) : null));
    });

    // Who does what: one column per person from the "Role <owner>: Headline: item, item; item" lines.
    var withRole = p.owners.filter(function (o) { return p.roles && p.roles[o]; });
    if (withRole.length) {
      add(body, h("section", { id: "roles", class: "roles" },
        h("div", { class: "sec-head" },
          h("span", { class: "sec-icon" }, icon("check")),
          h("h2", null, "Who does what"),
          h("span", { class: "count" }, "edit the Role lines in BACKLOG.md")),
        h("div", { class: "role-grid" }, withRole.map(function (o) {
          var r = p.roles[o], k = r.indexOf(": ");
          var head = k > 0 ? r.slice(0, k) : "", rest = k > 0 ? r.slice(k + 2) : r;
          var items = rest.split(/\s*[;,]\s*/).map(function (x) { return x.replace(/^(and|plus)\s+/i, "").trim(); }).filter(Boolean);
          return h("div", { class: "role" },
            h("div", { class: "role-who" }, avatar(o), h("b", null, cap(o)), o === S.me ? h("span", { class: "you" }, "You") : null),
            head ? h("p", { class: "role-head" }, head) : null,
            h("ul", { class: "role-items" }, items.map(function (x) { return h("li", null, x.charAt(0).toUpperCase() + x.slice(1)); })));
        }))));
    }
  }

  $("refreshBtn").addEventListener("click", function () { banner(); refresh(); });
  $("addBtn").addEventListener("click", addDialog);
  $("settingsBtn").addEventListener("click", settingsDialog);
  render();
  refresh();
})();
</script>
</body>
</html>
